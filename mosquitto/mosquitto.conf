# ============================================================
# Mosquitto untuk SproutFlow (mode local)
# - 1883 : MQTT TCP  -> backend + ESP32
# - 9001 : WebSocket -> frontend (VITE_MQTT_URL=ws://localhost:9001)
# ============================================================

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

# Akun wajib (lihat file passwd + acl). Sesuaikan .env backend/frontend dan
# firmware/sproutflow_esp32/config_local.h.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Retained message (status online, pump/status) tetap ada setelah restart.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
